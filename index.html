.header-sub{font-size:10px;color:#A09890;letter-spacing:0.8px;}

.tab{padding:7px 13px;font-size:12px;font-weight:500;color:#A09890;cursor:pointer;border-radius:8px 8px 0 0;border:none;background:none;font-family:'Noto Sans JP',sans-serif;transition:all 0.18s;position:relative;top:1px;}
.tab.active{color:#D4622A;background:#fff;border:1px solid rgba(28,22,18,0.1);border-bottom:1px solid #fff;}
.tab:not(.active):hover{color:#5C5248;background:rgba(0,0,0,0.03);}
.content{flex:1;background:#fff;border:1px solid rgba(28,22,18,0.1);border-top:none;padding:18px 20px;}
.section-label{font-size:10px;font-weight:700;color:#A09890;letter-spacing:1px;text-transform:uppercase;margin-bottom:7px;}
.wordcloud-wrap{background:#FBF8F3;border-radius:12px;padding:14px 16px;margin-bottom:16px;min-height:90px;}
.wordcloud-canvas{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:center;min-height:60px;}
.wc-word{display:inline-block;cursor:default;transition:transform 0.2s;font-family:'Noto Sans JP',sans-serif;font-weight:500;animation:wcFade 0.4s ease both;}
.wc-word:hover{transform:scale(1.12);}
@keyframes wcFade{from{opacity:0;transform:scale(0.85);}to{opacity:1;transform:scale(1);}}

.people-picker:hover{border-color:rgba(28,22,18,0.25);}
.avatar-sm{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;}
.search-input{width:100%;border:none;background:transparent;font-size:13px;font-family:'Noto Sans JP',sans-serif;color:#1C1612;outline:none;}
.search-input::placeholder{color:#A09890;}
.people-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid rgba(28,22,18,0.1);border-radius:10px;box-shadow:0 4px 16px rgba(28,22,18,0.1);overflow:hidden;z-index:20;max-height:220px;overflow-y:auto;}

.people-item-name{font-size:13px;font-weight:500;}
.people-item-dept{font-size:10px;color:#A09890;}
.dept-badge{font-size:9px;padding:1px 6px;border-radius:20px;margin-left:auto;white-space:nowrap;}
.msg-wrap{position:relative;margin-bottom:14px;}
.msg-area{width:100%;min-height:90px;border:1px solid rgba(28,22,18,0.1);border-radius:10px;padding:11px 12px;font-size:14px;font-family:'Noto Sans JP',sans-serif;background:#FBF8F3;color:#1C1612;resize:none;transition:border-color 0.15s;line-height:1.7;}
.msg-area:focus{outline:none;border-color:#D4622A;}
.char-count{position:absolute;bottom:9px;right:11px;font-size:10px;color:#A09890;}
.tags-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px;}
.tag-chip{padding:4px 10px;border-radius:20px;font-size:11px;cursor:pointer;border:1px solid rgba(28,22,18,0.1);color:#5C5248;background:#FBF8F3;transition:all 0.15s;font-family:'Noto Sans JP',sans-serif;}
.tag-chip:hover,.tag-chip.selected{background:#F5E8E0;border-color:#D4622A;color:#D4622A;}
.btn-send{width:100%;padding:12px;background:#D4622A;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;font-family:'Noto Sans JP',sans-serif;cursor:pointer;transition:all 0.18s;display:flex;align-items:center;justify-content:center;gap:6px;}
.btn-send:hover{background:#C0551F;transform:translateY(-1px);}
.btn-send:active{transform:translateY(0);}
.btn-send:disabled{background:#A09890;cursor:not-allowed;transform:none;}
.success-banner{background:#E0F0EC;border:1px solid rgba(42,122,106,0.2);border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:13px;color:#2A7A6A;font-weight:500;}
.error-banner{background:#FAECE7;border:1px solid rgba(153,60,29,0.2);border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:13px;color:#993C1D;}
.received-header{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.my-avatar{width:38px;height:38px;border-radius:50%;background:#F5E8E0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#D4622A;}
.badge-count{margin-left:auto;background:#D4622A;color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;}
.compliment-card{background:#FBF8F3;border-radius:12px;padding:13px 15px;margin-bottom:9px;border-left:3px solid #F5E8E0;transition:all 0.15s;}
.compliment-card:hover{border-left-color:#D4622A;transform:translateX(2px);}
.card-tag{display:inline-block;font-size:9px;font-weight:700;letter-spacing:0.5px;padding:2px 7px;border-radius:20px;margin-bottom:6px;}
.tag-team{background:#F5EDD8;color:#C4922A;}
.tag-idea{background:#F5E8E0;color:#D4622A;}
.tag-support{background:#EEEDFE;color:#534AB7;}

.card-date{font-size:10px;color:#A09890;margin-top:7px;}
.anon-badge{font-size:9px;color:#A09890;background:rgba(28,22,18,0.05);border-radius:4px;padding:1px 5px;margin-left:5px;}
.feed-filter{display:flex;gap:5px;margin-bottom:14px;flex-wrap:wrap;}
.filter-btn{padding:4px 11px;border-radius:20px;font-size:11px;cursor:pointer;border:1px solid rgba(28,22,18,0.1);background:none;color:#5C5248;font-family:'Noto Sans JP',sans-serif;transition:all 0.15s;}

.feed-card{background:#FBF8F3;border-radius:12px;padding:13px 15px;margin-bottom:9px;transition:all 0.15s;}

.feed-avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;}

      <div class="people-dropdown" id="people-dropdown" style="display:none" onclick="event.stopPropagation()"><div id="people-list"></div></div>
    </div>
    <div class="section-label">カテゴリ</div>
    <div class="tags-row">
      <div class="tag-chip" onclick="toggleTag(this,'チームワーク')">チームワーク</div>
      <div class="tag-chip" onclick="toggleTag(this,'アイデア')">アイデア</div>
      <div class="tag-chip" onclick="toggleTag(this,'サポート')">サポート</div>
      <div class="tag-chip" onclick="toggleTag(this,'仕事の質')">仕事の質</div>
      <div class="tag-chip" onclick="toggleTag(this,'リーダーシップ')">リーダーシップ</div>
    </div>
    <div class="section-label">メッセージ</div>

      <span class="char-count" id="char-count">0 / 200</span>
    </div>
    <button class="btn-send" id="send-btn" onclick="sendCompliment()" disabled>
      <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M1 7l11-5-5 11-2-4-4-2z" stroke="white" stroke-width="1.5" stroke-linejoin="round"/></svg>
      匿名で送る
    </button>
  </div>

  <div class="content" id="tab-received" style="display:none">
    <div class="received-header">
      <div class="my-avatar" id="my-avatar-char">あ</div>
      <div>
        <div style="font-size:14px;font-weight:700;" id="my-display-name">あなたへの Praise</div>
        <div style="font-size:10px;color:#A09890;margin-top:1px;">送信者は匿名・内容のみ表示</div>
      </div>
      <div class="badge-count" id="received-count">0件</div>
    </div>
    <div id="email-form-wrap" class="email-form">
      <div style="font-size:12px;color:#5C5248;margin-bottom:8px;">あなたのメールアドレスを入力してください</div>
      <input type="email" id="email-input" placeholder="minoru.ochi@daiko.co.jp">
      <button class="btn-sm" onclick="submitEmail()">確認する</button>
    </div>
    <div id="received-loading" class="loading" style="display:none"><div class="spinner"></div>読み込み中…</div>
    <div id="received-list"></div>
  </div>

  <div class="content" id="tab-feed" style="display:none">
    <div class="feed-filter">
      <button class="filter-btn active" onclick="setFilter(this,'all')">すべて</button>
      <button class="filter-btn" onclick="setFilter(this,'チームワーク')">チームワーク</button>
      <button class="filter-btn" onclick="setFilter(this,'アイデア')">アイデア</button>
      <button class="filter-btn" onclick="setFilter(this,'サポート')">サポート</button>
      <button class="filter-btn" onclick="setFilter(this,'仕事の質')">仕事の質</button>
      <button class="filter-btn" onclick="setFilter(this,'リーダーシップ')">リーダーシップ</button>
    </div>
    <div id="feed-loading" class="loading" style="display:none"><div class="spinner"></div>読み込み中…</div>
    <div id="feed-list"></div>
  </div>
</div>

}

let selectedPerson=null,selectedTag=null,currentFilter='all',feedData=[],feedLoaded=false;

function init(){initWordCloud();renderPeopleList('');}

const WC_FALLBACK=[];

function buildWordCloud(words){
  const max=Math.max(...words.map(w=>w.w));
  const colors=['#D4622A','#2A7A6A','#534AB7','#C4922A','#993C1D','#0F6E56','#854F0B'];
  const c=document.getElementById('wordcloud');c.innerHTML='';
  words.sort(()=>Math.random()-0.5).forEach((item,i)=>{
    const s=document.createElement('span');s.className='wc-word';s.textContent=item.word;
    s.style.fontSize=(10+Math.round((item.w/max)*14))+'px';s.style.color=colors[i%colors.length];
    s.style.opacity=0.5+(item.w/max)*0.5;s.style.animationDelay=(i*0.04)+'s';c.appendChild(s);
  });
}

async function initWordCloud(){
  const container=document.getElementById('wordcloud');
  container.innerHTML='<span style="font-size:12px;color:#A09890;">まだ投稿がありません。最初の褒めを送ってみましょう！</span>';
  try{
    const res=await sbFetch('/rest/v1/praiseboard?select=message&order=created_at.desc&limit=100');
    const data=await res.json();
    if(Array.isArray(data)&&data.length>0){
      const freq={};
      const stop=new Set(['が','の','に','を','は','で','と','た','し','て','も','な','い','です','ます','ました','から','こと','ない','れ','その','この','あ','う','か','さ','ん','よ','ね','だ','や','へ','ら','ば','くれ','くれた','くれて','もう','まで','ので','など','という','思い','思う','いる','ある','なる']);
      data.forEach(item=>{
        if(!item.message)return;
        // 日本語（ひらがな・カタカナ・漢字）の単語のみ抽出
        const jaWords=item.message.match(/[\u3040-\u9FFF\u30A0-\u30FF]{2,}/g)||[];
        jaWords.forEach(w=>{if(!stop.has(w))freq[w]=(freq[w]||0)+1;});
      });
      const sorted=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,18).map(([word,w])=>({word,w}));
      if(sorted.length>0){buildWordCloud(sorted);return;}
    }
  }catch(e){console.error(e);}
}

function switchTab(tab,el){
  ['send','received','feed'].forEach(t=>{document.getElementById('tab-'+t).style.display=t===tab?'block':'none';});
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');
  if(tab==='feed'&&!feedLoaded)loadFeed();
}

function onSearch(q){showDropdown();renderPeopleList(q);if(selectedPerson)clearPerson();}
function showDropdown(){document.getElementById('people-dropdown').style.display='block';renderPeopleList(document.getElementById('search-input').value);}
function renderPeopleList(q){
  const filtered=q.trim()?MEMBERS.filter(m=>m.name.includes(q)||m.dept.includes(q)):MEMBERS;
  const list=document.getElementById('people-list');
  if(!filtered.length){list.innerHTML='<div style="padding:12px;font-size:12px;color:#A09890;text-align:center;">該当なし</div>';return;}
  list.innerHTML=filtered.map(m=>{
    const st=DEPT_STYLE[m.dept]||{bg:'#F1EFE8',tc:'#5C5248',badge:'#888780'};
    const init=m.name.replace(/\s/g,'').charAt(0);
    const ms=JSON.stringify(m).replace(/"/g,'&quot;');
    return`<div class="people-item" onclick='selectPerson(${ms})'><div class="avatar-sm" style="background:${st.bg};color:${st.tc}">${init}</div><div><div class="people-item-name">${m.name}</div><div class="people-item-dept">${m.dept}</div></div><div class="dept-badge" style="background:${st.bg};color:${st.badge}">${m.dept.replace('大広ＤＡ局','')||'DA局'}</div></div>`;
  }).join('');
}
function selectPerson(m){
  selectedPerson=m;const st=DEPT_STYLE[m.dept]||{bg:'#F1EFE8',tc:'#5C5248'};const init=m.name.replace(/\s/g,'').charAt(0);
  document.getElementById('search-input').value='';document.getElementById('search-input').placeholder=m.name;document.getElementById('search-input').style.opacity='0';
  const badge=document.getElementById('picker-selected-badge');badge.style.display='flex';
  document.getElementById('badge-avatar').style.background=st.bg;document.getElementById('badge-avatar').style.color=st.tc;document.getElementById('badge-avatar').textContent=init;
  document.getElementById('badge-name').textContent=m.name;document.getElementById('badge-dept').textContent=m.dept;
  document.getElementById('picker-clear').style.display='flex';document.getElementById('people-dropdown').style.display='none';validateSend();
}
function clearPerson(){
  selectedPerson=null;document.getElementById('search-input').value='';document.getElementById('search-input').placeholder='名前・部署で検索…';document.getElementById('search-input').style.opacity='1';
  document.getElementById('picker-selected-badge').style.display='none';document.getElementById('picker-clear').style.display='none';validateSend();
}
function toggleTag(el,tag){document.querySelectorAll('.tag-chip').forEach(c=>c.classList.remove('selected'));selectedTag=(selectedTag===tag)?null:tag;if(selectedTag)el.classList.add('selected');}
function updateCount(){const v=document.getElementById('msg-area').value.length;document.getElementById('char-count').textContent=v+' / 200';validateSend();}
function validateSend(){document.getElementById('send-btn').disabled=!(!!selectedPerson&&document.getElementById('msg-area').value.trim().length>0);}

async function sendCompliment(){
  const btn=document.getElementById('send-btn');btn.disabled=true;btn.textContent='送信中…';
  ['send-success','send-error'].forEach(id=>document.getElementById(id).style.display='none');
  try{
    const res=await sbFetch('/rest/v1/praiseboard',{method:'POST',body:JSON.stringify({recipient_email:selectedPerson.mail,recipient_name:selectedPerson.name,message:document.getElementById('msg-area').value.trim(),category:selectedTag||'その他'})});
    if(res.ok||res.status===201||res.status===204){
      document.getElementById('send-success').style.display='block';
      document.getElementById('msg-area').value='';document.getElementById('char-count').textContent='0 / 200';
      clearPerson();selectedTag=null;document.querySelectorAll('.tag-chip').forEach(c=>c.classList.remove('selected'));
      feedLoaded=false;setTimeout(()=>{document.getElementById('send-success').style.display='none';},5000);
    }else throw new Error('status '+res.status);
  }catch(e){document.getElementById('send-error').style.display='block';console.error(e);}
  btn.innerHTML='<svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M1 7l11-5-5 11-2-4-4-2z" stroke="white" stroke-width="1.5" stroke-linejoin="round"/></svg> 匿名で送る';validateSend();
}

function submitEmail(){
  const email=document.getElementById('email-input').value.trim();
  if(!email)return;
  document.getElementById('email-form-wrap').style.display='none';
  loadReceived(email);
}

const TAG_CLASS={チームワーク:'tag-team',アイデア:'tag-idea',サポート:'tag-support','仕事の質':'tag-work',リーダーシップ:'tag-lead'};

async function loadReceived(email){
  document.getElementById('received-loading').style.display='block';
  document.getElementById('received-list').innerHTML='';
  const name=email.split('@')[0];
  document.getElementById('my-display-name').textContent=name+' への Praise';
  document.getElementById('my-avatar-char').textContent=name.charAt(0).toUpperCase();
  try{
    const res=await sbFetch('/rest/v1/praiseboard?recipient_email=eq.'+encodeURIComponent(email)+'&order=created_at.desc&select=message,category,created_at',{headers:{'Prefer':''}});
    const data=await res.json();
    const items=Array.isArray(data)?data:[];
    document.getElementById('received-count').textContent=items.length+'件';
    if(!items.length){document.getElementById('received-list').innerHTML='<div class="empty-state">まだ褒めが届いていません。<br>あなたの活躍を誰かが見ています！</div>';}
    else{document.getElementById('received-list').innerHTML=items.map(item=>`<div class="compliment-card"><span class="card-tag ${TAG_CLASS[item.category]||'tag-work'}">${item.category||'その他'}</span><div class="card-msg">${esc(item.message)}</div><div class="card-date">${fmtDate(item.created_at)}<span class="anon-badge">匿名</span></div></div>`).join('');}
  }catch(e){document.getElementById('received-list').innerHTML='<div class="empty-state">データの取得に失敗しました。</div>';}
  document.getElementById('received-loading').style.display='none';
}

async function loadFeed(){
  document.getElementById('feed-loading').style.display='block';
  try{
    const res=await sbFetch('/rest/v1/praiseboard?order=created_at.desc&limit=100&select=recipient_name,message,category,created_at',{headers:{'Prefer':''}});
    feedData=await res.json();if(!Array.isArray(feedData))feedData=[];feedLoaded=true;
  }catch(e){feedData=[];}
  document.getElementById('feed-loading').style.display='none';renderFeed();
}
function renderFeed(){
  const DEPT_COLORS=[{bg:'#F5E8E0',tc:'#D4622A'},{bg:'#E0F0EC',tc:'#2A7A6A'},{bg:'#F5EDD8',tc:'#C4922A'},{bg:'#EAEBF7',tc:'#534AB7'},{bg:'#FBEAF0',tc:'#993556'}];
  const filtered=currentFilter==='all'?feedData:feedData.filter(d=>d.category===currentFilter);
  if(!filtered.length){document.getElementById('feed-list').innerHTML='<div class="empty-state">まだ投稿がありません。<br>最初の褒めを送ってみましょう！</div>';return;}
  document.getElementById('feed-list').innerHTML=filtered.map((d,i)=>{const c=DEPT_COLORS[i%5];return`<div class="feed-card"><div class="feed-to"><div class="feed-avatar" style="background:${c.bg};color:${c.tc}">${(d.recipient_name||'?').charAt(0)}</div><span class="feed-name">${esc(d.recipient_name||'')}</span><span class="card-tag ${TAG_CLASS[d.category]||'tag-work'}" style="margin-left:auto;margin-bottom:0">${d.category||'その他'}</span></div><div class="feed-msg">${esc(d.message)}</div><div class="feed-footer"><span class="feed-anon">匿名より</span><span class="feed-time">${fmtDate(d.created_at)}</span></div></div>`;}).join('');
}
function setFilter(btn,val){currentFilter=val;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderFeed();}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtDate(iso){if(!iso)return'';try{return new Date(iso).toLocaleDateString('ja-JP',{month:'long',day:'numeric'});}catch{return iso;}}
document.addEventListener('click',e=>{if(!document.getElementById('picker-wrap')?.contains(e.target))document.getElementById('people-dropdown').style.display='none';});
init();
</script>
